<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Slot 777 - Hulu Bet</title>
  <style>
    :root {
      --bg: #03140e;
      --panel-bg: #061f16;
      --gold: #f5b027;
      --gold-dark: #b87c10;
      --gold-glow: rgba(245, 176, 39, 0.5);
      --green-neon: #10e587;
      --green-neon-glow: rgba(16, 229, 135, 0.45);
      --green-btn: #0b4b32;
      --red-btn: #e5294e;
      --border-gold: rgba(212, 163, 57, 0.45);
      --text-muted: #8ca59b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(16, 229, 135, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 10% 85%, rgba(13, 85, 55, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(13, 85, 55, 0.3) 0%, transparent 50%);
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient Clover Watermark Background */
    .bg-clovers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><circle cx="34" cy="34" r="10" fill="%2310e587"/><circle cx="46" cy="34" r="10" fill="%2310e587"/><circle cx="34" cy="46" r="10" fill="%2310e587"/><circle cx="46" cy="46" r="10" fill="%2310e587"/><path d="M40 40 L40 65" stroke="%2310e587" stroke-width="4"/></svg>');
      z-index: 0;
    }

    /* Preloader */
    #preloader {
      position: fixed;
      inset: 0;
      background: #020c08;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .loader-ring {
      width: 58px;
      height: 58px;
      border: 4px solid rgba(16, 229, 135, 0.15);
      border-top-color: var(--green-neon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--gold);
    }
    .loader-progress-bar {
      width: 200px;
      height: 6px;
      background: #0d281e;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(245, 176, 39, 0.3);
    }
    .loader-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #10e587, #ffd269);
      transition: width 0.15s ease-out;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* App Shell */
    #app {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 14px;
      position: relative;
      z-index: 1;
    }

    /* Reels Header Labels */
    .reels-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .btn-rules-icon {
      background: rgba(14, 45, 33, 0.6);
      border: 1px solid rgba(212, 163, 57, 0.4);
      color: var(--gold);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: transform 0.1s;
    }
    .btn-rules-icon:active { transform: scale(0.92); }

    /* Slot Machine Frame */
    .slot-frame {
      display: flex;
      gap: 6px;
      padding: 5px;
      background: linear-gradient(180deg, #0a2d20 0%, #03130d 100%);
      border: 1.5px solid var(--border-gold);
      border-radius: 14px;
      box-shadow: inset 0 0 16px #000, 0 8px 24px rgba(0,0,0,0.65);
      position: relative;
    }

    /* Left Multiplier Reel */
    .multiplier-column {
      width: 66px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: space-between;
    }

    .mult-box {
      flex: 1;
      height: 78px;
      background: #061912;
      border: 1.2px solid rgba(212, 163, 57, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #3f6856;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .mult-box.active {
      background: linear-gradient(180deg, #0d462d 0%, #08291a 100%);
      border: 2px solid var(--green-neon);
      box-shadow: 0 0 14px var(--green-neon), inset 0 0 8px rgba(16, 229, 135, 0.5);
      color: #fffb8f;
      transform: scale(1.03);
    }

    /* 3x3 Reels Grid */
    .reels-grid-wrapper {
      flex: 1;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid rgba(212, 163, 57, 0.7);
      background: #04140e;
    }

    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      height: 246px; /* 3 rows x 82px */
      position: relative;
      z-index: 2;
    }

    .reel-col {
      overflow: hidden;
      position: relative;
      border-right: 1px solid rgba(212, 163, 57, 0.2);
    }
    .reel-col:last-child { border-right: none; }

    .reel-tape {
      display: flex;
      flex-direction: column;
      transform: translateY(0px);
      will-change: transform;
    }

    .symbol {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      position: relative;
    }

    .symbol img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
      transition: transform 0.2s ease;
    }

    .symbol.winning img {
      animation: winPulse 0.5s infinite alternate ease-in-out;
    }

    @keyframes winPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 4px var(--gold)); }
      100% { transform: scale(1.18); filter: drop-shadow(0 0 16px #ffe600); }
    }

    /* SVG Paylines Canvas Overlay */
    #paylines-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .payline-wire {
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .payline-wire.active {
      opacity: 1;
      animation: lineGlow 0.6s infinite alternate;
    }

    @keyframes lineGlow {
      from { stroke: #ffd269; filter: drop-shadow(0 0 4px #ffd269); }
      to { stroke: #10e587; filter: drop-shadow(0 0 10px #10e587); }
    }

    /* Status Bar below reels */
    .status-strip {
      display: flex;
      margin-top: 10px;
      background: linear-gradient(180deg, #09281e 0%, #051a13 100%);
      border: 1px solid rgba(16, 229, 135, 0.25);
      border-radius: 10px;
      height: 48px;
    }

    .status-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .status-box:last-child { border-right: none; }
    .status-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .status-vals { display: flex; flex-direction: column; }
    .status-num { font-size: 13px; font-weight: 800; color: #fff; }
    .status-unit { font-size: 9px; color: var(--gold); font-weight: 700; margin-top: -2px; }

    /* Action Hexagons */
    .hex-actions-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 14px 0 10px;
      padding: 0 10px;
    }

    .hex-btn {
      width: 74px;
      height: 80px;
      background: #0c2d20;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      border: none;
      outline: none;
      transition: transform 0.1s, opacity 0.2s;
    }

    .hex-btn::before {
      content: "";
      position: absolute;
      inset: 2px;
      background: #082117;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      z-index: 1;
    }

    .hex-btn-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .hex-btn svg { width: 28px; height: 28px; }
    .hex-btn span { font-size: 15px; font-weight: 900; }

    .hex-btn.active-glow {
      background: #14704b;
      box-shadow: 0 0 14px var(--green-neon-glow);
    }
    .hex-btn.active-glow::before { background: #0c3826; }
    .hex-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Primary Spin Console */
    .spin-console {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .console-bg-bar {
      position: absolute;
      width: 92%;
      height: 54px;
      background: linear-gradient(180deg, #0e3b29 0%, #061e15 100%);
      border: 1.5px solid #1c6b4d;
      border-radius: 27px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .step-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(180deg, #1b7351 0%, #0d4630 100%);
      border: 1px solid #2fa577;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    .step-btn:active { transform: scale(0.95); }

    .next-bet-hint {
      position: absolute;
      right: 74px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #79a693;
    }

    /* Big Center Hexagonal Spin Button */
    .spin-main-btn {
      position: relative;
      z-index: 3;
      width: 126px;
      height: 126px;
      background: linear-gradient(180deg, #d32049 0%, #890c28 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(229, 41, 78, 0.45);
      transition: transform 0.08s ease;
    }
    .spin-main-btn:active { transform: scale(0.96); }

    .spin-btn-inner {
      width: 118px;
      height: 118px;
      background: linear-gradient(180deg, #0e4f34 0%, #052619 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .spin-amount {
      font-size: 20px;
      font-weight: 900;
      color: #7ce771;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      line-height: 1;
    }
    .spin-unit {
      font-size: 11px;
      font-weight: 800;
      color: #4da581;
      margin-bottom: 2px;
    }
    .spin-arrow svg {
      width: 38px;
      height: 22px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Modals Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 99;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      max-height: 88vh;
      background: #092018;
      border: 1.5px solid rgba(212, 163, 57, 0.6);
      border-radius: 16px;
      overflow-y: auto;
      padding: 18px 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .modal-title { font-size: 16px; font-weight: 800; color: var(--gold); }
    .modal-close { background: none; border: none; color: #ff3b56; font-size: 22px; cursor: pointer; }

    /* Autoplay Detailed Modal (matches screenshot 1) */
    .autoplay-counts-grid { display: flex; gap: 6px; }
    .auto-chip {
      flex: 1;
      height: 42px;
      background: #113628;
      border: 1px solid #1e5942;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .auto-chip.selected {
      background: var(--red-btn);
      border-color: #ff5b79;
    }

    .auto-config-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #051912;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .config-label-row { font-size: 11px; font-weight: 800; color: #79a693; text-transform: uppercase; }
    .config-input-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .config-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #092018;
      border: 1px solid rgba(212, 163, 57, 0.4);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .config-input-wrap input {
      width: 60px;
      background: transparent;
      border: none;
      color: #fff;
      font-weight: 700;
      text-align: right;
      outline: none;
    }
    .config-input-wrap span { font-size: 11px; color: var(--gold); font-weight: 700; }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #213d31;
      border-radius: 24px;
      transition: .3s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background-color: var(--red-btn); }
    input:checked + .slider:before { transform: translateX(20px); }

    .auto-start-btn {
      background: var(--red-btn);
      color: #fff;
      border: none;
      border-radius: 8px;
      height: 44px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(229, 41, 78, 0.4);
    }

    /* Paytable modal */
    .pay-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #061912;
      border-radius: 8px;
      border: 1px solid rgba(212, 163, 57, 0.2);
    }
    .pay-icons { display: flex; gap: 8px; align-items: center; }
    .pay-icons img { width: 34px; height: 34px; object-fit: contain; }
    .pay-val { font-size: 14px; font-weight: 800; color: var(--gold); text-align: right; }

    /* Gamble screen (screenshot 4) */
    .gamble-card-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
    }
    .gamble-card {
      width: 90px;
      height: 130px;
      border-radius: 10px;
      background: #062b1e;
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      perspective: 1000px;
      transition: transform 0.4s ease;
    }
    .gamble-card svg { width: 56px; height: 56px; }
    .gamble-choices { display: flex; gap: 14px; width: 100%; }
    .gamble-choice-btn {
      flex: 1;
      height: 44px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      border: 2px solid var(--gold);
      cursor: pointer;
    }
    .btn-gamble-red { background: #d32049; color: #fff; }
    .btn-gamble-black { background: #111; color: var(--gold); }

    /* Big Win Celebration Splash */
    #celebration-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 998;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
    }
    .celebration-title {
      font-size: 32px;
      font-weight: 900;
      color: #ffd269;
      text-shadow: 0 0 20px #ffb703, 0 0 40px #ff9500;
      letter-spacing: 2px;
      animation: popBounce 0.6s infinite alternate;
    }
    .celebration-amount {
      font-size: 42px;
      font-weight: 900;
      color: var(--green-neon);
      text-shadow: 0 0 18px var(--green-neon);
    }
    @keyframes popBounce {
      from { transform: scale(0.95); }
      to { transform: scale(1.08); }
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1f2722;
      border: 1px solid var(--gold);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.7);
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="bg-clovers"></div>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="loader-ring"></div>
    <div class="loader-text" id="loader-percent">LOADING ASSETS 0%</div>
    <div class="loader-progress-bar">
      <div class="loader-progress-fill" id="loader-fill"></div>
    </div>
  </div>

  <div id="app">
    <!-- Top Labels (Lobby Header Removed) -->
    <div class="reels-labels">
      <span>MULTIPLIER</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span>5 LINES FIXED</span>
        <button class="btn-rules-icon" onclick="openRulesModal()" title="Paytable">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Slot Box -->
    <div class="slot-frame">
      <!-- Multipliers -->
      <div class="multiplier-column">
        <div class="mult-box" id="mult-3">3x</div>
        <div class="mult-box active" id="mult-5">5x</div>
        <div class="mult-box" id="mult-1">1x</div>
      </div>

      <!-- 3x3 Reels Grid with SVG Lines Overlay -->
      <div class="reels-grid-wrapper">
        <svg id="paylines-svg" viewBox="0 0 300 246" preserveAspectRatio="none">
          <!-- 5 Fixed Paylines: Top, Center, Bottom, Diag 1, Diag 2 -->
          <line id="line-0" class="payline-wire" x1="0" y1="41" x2="300" y2="41" />
          <line id="line-1" class="payline-wire" x1="0" y1="123" x2="300" y2="123" />
          <line id="line-2" class="payline-wire" x1="0" y1="205" x2="300" y2="205" />
          <line id="line-3" class="payline-wire" x1="0" y1="41" x2="300" y2="205" />
          <line id="line-4" class="payline-wire" x1="0" y1="205" x2="300" y2="41" />
        </svg>

        <div class="reels-grid">
          <div class="reel-col" id="reel-0"><div class="reel-tape" id="tape-0"></div></div>
          <div class="reel-col" id="reel-1"><div class="reel-tape" id="tape-1"></div></div>
          <div class="reel-col" id="reel-2"><div class="reel-tape" id="tape-2"></div></div>
        </div>
      </div>
    </div>

    <!-- Status Strip: Balance, Win, Total -->
    <div class="status-strip">
      <div class="status-box">
        <div class="status-icon">
          <svg viewBox="0 0 24 24" fill="#10e587" width="18" height="18">
            <path d="M21 18v1a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1h-9a2 2 0 00-2 2v8a2 2 0 002 2h9zm-9-2h10V8H12v8zm4-2.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
          </svg>
        </div>
        <div class="status-vals">
          <span class="status-num" id="ui-balance">0.00</span>

  <!-- Toast -->

  <script>
    /* =====================================================================
       1. SYNTHESIZED AUDIO ENGINE (Web Audio API - 0 External Dependencies)
       ===================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playStop() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playWin() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          const t = this.ctx.currentTime + (i * 0.08);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        });
      }
    }
    const sound = new SoundEngine();
    window.addEventListener('click', () => sound.init(), { once: true });
    window.addEventListener('touchstart', () => sound.init(), { once: true });

    /* =====================================================================
       2. MANDATORY HULU BET BOILERPLATE & INTEGRATION SPEC
       ===================================================================== */
    const API = "https://hulubet-server.onrender.com";
    let INIT_DATA = "", serverBalance = 0, ready = false;

    async function api(path, opts = {}) {
      try {
        const r = await fetch(API + path, {
          ...opts,
          headers: {
            'Content-Type': 'application/json',
            'x-telegram-init-data': INIT_DATA
          }
        });
        return await r.json();
      } catch (e) {
        return { success: false, message: 'Connection problem' };
      }
    }

    const postParent = m => {
      try { parent.postMessage(m, '*'); } catch (e) {}
    };

    addEventListener('message', e => {
      if (e.source !== parent) return;
      const d = e.data || {};
      if (d.type === 'INIT' && d.initData) {
        INIT_DATA = d.initData;
        ready = true;
        refreshBalance();
      }
      if (d.type === 'UPDATE_BALANCE') refreshBalance();
    });

    postParent({ type: 'GAME_READY' });

    async function refreshBalance() {
      const d = await api('/api/user/init');
      if (d && d.success) {
        serverBalance = d.balance;
        showBalance();
      }
    }

    function showBalance() {
      document.getElementById('ui-balance').textContent = Number(serverBalance).toFixed(2);
      postParent({ type: 'BALANCE_UPDATE', newBalance: serverBalance });
    }

    /* =====================================================================
       3. SYMBOLS WITH YOUR SPECIFIC 100x100 IMAGE ASSETS
       ===================================================================== */
    const SYMBOLS = [
      { id: "77", name: "Red 77", url: "https://i.postimg.cc/8PsYQ8TW/20260930-173555.png", triple: 75.0, pair: 5.0 },
      { id: "DOLLAR", name: "Dollars", url: "https://i.postimg.cc/k5N1Fqyt/20260930-173649.png", triple: 50.0, pair: 4.0 },
      { id: "BELL", name: "Rings", url: "https://i.postimg.cc/pLF1rDhZ/20260930-173630.png", triple: 25.0, pair: 2.5 },
      { id: "MELON", name: "Watermelon", url: "https://i.postimg.cc/L8K3yG5j/20260930-174342.png", triple: 20.0, pair: 2.0 },
      { id: "MANY_GRAPES", name: "Grapes", url: "https://i.postimg.cc/ZRR8BS78/20260930-174419.png", triple: 20.0, pair: 2.0 },
      { id: "PLUM", name: "Two Plums", url: "https://i.postimg.cc/c4KFkQch/20260930-173830.png", triple: 10.0, pair: 1.0 },
      { id: "LEMON", name: "Lemon", url: "https://i.postimg.cc/hvv2BxR9/20260930-173752.png", triple: 10.0, pair: 1.0 },
      { id: "ORANGE", name: "Two Oranges", url: "https://i.postimg.cc/Y0vzVHQr/20260930-173938.png", triple: 10.0, pair: 1.0 },
      { id: "CHERRY", name: "Red Prims", url: "https://i.postimg.cc/9QZJCCK1/20260930-173924.png", triple: 10.0, pair: 1.0 }
    ];

    /* =====================================================================
       4. PRELOAD ASSETS
       ===================================================================== */
    const preloadedImages = {};
    function preloadAllImages() {
      let loaded = 0;
      const total = SYMBOLS.length;
      const percentEl = document.getElementById('loader-percent');
      const fillEl = document.getElementById('loader-fill');

      return new Promise(resolve => {
        SYMBOLS.forEach(s => {
          const img = new Image();
          img.src = s.url;
          img.onload = img.onerror = () => {
            loaded++;
            const pct = Math.floor((loaded / total) * 100);
            percentEl.textContent = `LOADING ASSETS ${pct}%`;
            fillEl.style.width = `${pct}%`;
            preloadedImages[s.id] = s.url;

            if (loaded >= total) {
              setTimeout(() => {
                const loader = document.getElementById('preloader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                setTimeout(() => loader.remove(), 400);
                resolve();
              }, 250);
            }
          };
        });
      });
    }

    /* =====================================================================
       5. GAME STATE & PAYTABLE SYNC
       ===================================================================== */
    const BET_PRESETS = [1, 2, 3, 5, 8, 10, 15, 20, 30, 50, 75, 100, 200, 500, 1000];
    let betIdx = 3; // 5.00 ETB
    let isSpinning = false;
    let autoplayRemaining = 0;
    let selectedAutoCount = 10;
    let currentRoundWin = 0;
    let totalWinAccum = 0;
    let startingAutoBalance = 0;

    const TAPE_LENGTH = 24;
    const SYMBOL_HEIGHT = 82;

    let PAYTABLE = null;
    async function loadPaytable() {
      const d = await api('/api/slot/paytable');
      if (d && d.success) {
        PAYTABLE = d;
        renderPaytableModal();
      } else {
        setTimeout(loadPaytable, 4000);
      }
    }

    function renderPaytableModal() {
      const list = document.getElementById('paytable-list');
      list.innerHTML = "";
      const bet = getCurrentBet();
      const symList = (PAYTABLE && PAYTABLE.symbols) ? PAYTABLE.symbols : SYMBOLS;

      symList.forEach(ps => {
        const s = SYMBOLS.find(x => x.id === ps.id) || ps;
        const triplePayout = (ps.triple || 10) * bet;
        const pairPayout = (ps.pair || 1) * bet;
        const row = document.createElement('div');
        row.className = "pay-item";
        row.innerHTML = `
          <div class="pay-icons">
            <img src="${s.url}" width="34" height="34" alt="${s.name}" />
            <span style="font-weight:700; font-size:13px;">${s.name}</span>
          </div>
          <span class="pay-val">
            3 of a kind: ${triplePayout.toFixed(2)} ETB<br>
            <span style="font-size:11px; opacity:.8;">any 2 alike: ${pairPayout.toFixed(2)} ETB</span>
          </span>
        `;
        list.appendChild(row);
      });
    }

    loadPaytable();

    function getCurrentBet() {
      return BET_PRESETS[betIdx];
    }

    function updateBetUI() {
      const bet = getCurrentBet();
      document.getElementById('spin-btn-amount').textContent = bet.toFixed(2);
      const nextBet = betIdx < BET_PRESETS.length - 1 ? BET_PRESETS[betIdx + 1] : BET_PRESETS[0];
      document.getElementById('hint-next-bet').innerHTML = `${nextBet.toFixed(2)}<br>ETB`;
      renderPaytableModal();
    }

    function adjustBet(delta) {
      if (isSpinning) return;
      betIdx += delta;
      if (betIdx < 0) betIdx = 0;
      if (betIdx >= BET_PRESETS.length) betIdx = BET_PRESETS.length - 1;
      updateBetUI();
    }

    function initReelTapes() {
      for (let r = 0; r < 3; r++) {
        const tape = document.getElementById(`tape-${r}`);
        tape.innerHTML = "";
        for (let i = 0; i < TAPE_LENGTH; i++) {
          const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          const cell = document.createElement('div');
          cell.className = "symbol";
          cell.dataset.symbolId = sym.id;
          cell.innerHTML = `<img src="${sym.url}" alt="${sym.name}" />`;
          tape.appendChild(cell);
        }
      }
    }

    function setMultiplierActive(mult) {
      [1, 3, 5].forEach(m => {
        const el = document.getElementById(`mult-${m}`);
        if (el) el.classList.remove('active');
      });
      const target = document.getElementById(`mult-${mult}`) || document.getElementById('mult-1');
      if (target) target.classList.add('active');
    }

    /* =====================================================================
       6. SPIN & BET EXECUTION (AUTHORITATIVE SERVER ONLY)
       ===================================================================== */
    async function onSpinClick() {
      if (isSpinning) return;
      const betAmount = getCurrentBet();

      if (serverBalance < betAmount) {
        showToast("Insufficient balance");
        postParent({ type: 'OPEN_DEPOSIT' });
        autoplayRemaining = 0;
        return;
      }

      isSpinning = true;
      toggleControls(false);
      clearWinningHighlight();
      hidePaylines();
      postParent({ type: 'BET_STARTED' });

      startReelSpin();

      // Hulu Bet server request
      const res = await api('/api/bet/play', {
        method: 'POST',
        body: JSON.stringify({
          gameName: "Slot777",
          betAmount: betAmount,
          clientData: {}
        })
      });

      if (!res || !res.success) {
        stopReelSpinInstant();
        isSpinning = false;
        toggleControls(true);
        postParent({ type: 'BET_ENDED' });
        showToast(res ? res.message : "Error placing bet");
        autoplayRemaining = 0;
        return;
      }

      // Hide payout from display balance until reels settle
      serverBalance = res.newBalance;
      document.getElementById('ui-balance').textContent = Number(res.newBalance - (res.payout || 0)).toFixed(2);

      const outcome = res.visualOutcome || {};
      if (!Array.isArray(outcome.reels) || outcome.reels.length !== 3) {
        stopReelSpinInstant();
        isSpinning = false;
        toggleControls(true);
        postParent({ type: 'BET_ENDED' });
        showToast('Unexpected server reply');
        autoplayRemaining = 0;
        refreshBalance();
        return;
      }

      await stopReelsOnOutcome(outcome.reels, outcome.colMult || 1);

      currentRoundWin = res.payout || 0;
      document.getElementById('ui-win').textContent = currentRoundWin.toFixed(2);
      showBalance();

      if (res.isWin && currentRoundWin > 0) {
        totalWinAccum += currentRoundWin;
        document.getElementById('ui-total-win').textContent = totalWinAccum.toFixed(2);
        highlightWinLine(outcome.winReels);
        showPayline(outcome.payline);
        sound.playWin();

        // Enable 2X Gamble & Collect buttons
        document.getElementById('btn-gamble').disabled = false;
        document.getElementById('btn-collect').disabled = false;

        // Big win trigger check (>= 15x bet)
        const isBigWin = (res.multiplier >= 15);
        if (isBigWin) {
          triggerBigWinOverlay(currentRoundWin);
          const stopOnBig = document.getElementById('auto-stop-bigwin').checked;
          if (stopOnBig) autoplayRemaining = 0;
        } else {
          showToast(`WIN! ${currentRoundWin.toFixed(2)} ETB (x${res.multiplier})`);
        }
      } else {
        document.getElementById('btn-gamble').disabled = true;
        document.getElementById('btn-collect').disabled = true;
      }

      isSpinning = false;
      toggleControls(true);
      postParent({ type: 'BET_ENDED' });

      // Autoplay conditional rules handling
      checkAutoplayConditions();
    }

    function toggleControls(enable) {
      document.getElementById('btn-spin').style.pointerEvents = enable ? 'auto' : 'none';
      document.getElementById('btn-minus').style.pointerEvents = enable ? 'auto' : 'none';
      document.getElementById('btn-plus').style.pointerEvents = enable ? 'auto' : 'none';
      document.getElementById('btn-auto').disabled = !enable;
    }

    let spinIntervals = [];

    function startReelSpin() {
      for (let r = 0; r < 3; r++) {
        const tape = document.getElementById(`tape-${r}`);
        tape.style.transition = 'none';
        let y = 0;
        spinIntervals[r] = setInterval(() => {
          y -= 32;
          if (y <= -SYMBOL_HEIGHT * 6) y = 0;
          tape.style.transform = `translateY(${y}px)`;
          if (r === 0 && Math.random() < 0.25) sound.playTick();
        }, 16);
      }
    }

    function stopReelSpinInstant() {
      spinIntervals.forEach(clearInterval);
      spinIntervals = [];
      for (let r = 0; r < 3; r++) {
        const tape = document.getElementById(`tape-${r}`);
        tape.style.transform = `translateY(0px)`;
      }
    }

    function stopReelsOnOutcome(serverSymbols, colMult) {
      return new Promise(resolve => {
        setMultiplierActive(colMult);

        for (let r = 0; r < 3; r++) {
          setTimeout(() => {
            clearInterval(spinIntervals[r]);
            sound.playStop();
            const tape = document.getElementById(`tape-${r}`);
            tape.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25)';

            // Populate middle row with target outcome, with realistic top/bottom neighbours
            const symKey = serverSymbols[r];
            const symCenter = SYMBOLS.find(s => s.id === symKey) || SYMBOLS[0];
            const symTop = SYMBOLS[(SYMBOLS.indexOf(symCenter) + 1) % SYMBOLS.length];
            const symBottom = SYMBOLS[(SYMBOLS.indexOf(symCenter) + 2) % SYMBOLS.length];

            // tape cells: 0 = top row, 1 = center payline, 2 = bottom row
            tape.children[0].innerHTML = `<img src="${symTop.url}" alt="${symTop.name}" />`;
            tape.children[1].innerHTML = `<img src="${symCenter.url}" alt="${symCenter.name}" />`;
            tape.children[1].dataset.symbolId = symCenter.id;
            tape.children[2].innerHTML = `<img src="${symBottom.url}" alt="${symBottom.name}" />`;

            tape.style.transform = `translateY(0px)`;

            if (r === 2) {
              setTimeout(resolve, 400);
            }
          }, 320 * (r + 1));
        }
      });
    }

    function highlightWinLine(winReels) {
      const list = Array.isArray(winReels) && winReels.length ? winReels : [0, 1, 2];
      for (const r of list) {
        const tape = document.getElementById(`tape-${r}`);
        if (tape.children[1]) {
          tape.children[1].classList.add('winning');
        }
      }
    }

    function clearWinningHighlight() {
      document.querySelectorAll('.symbol.winning').forEach(el => el.classList.remove('winning'));
    }

    function showPayline(paylineName) {
      hidePaylines();
      // Line index mapping: 0=Top, 1=Center, 2=Bottom, 3=DiagDown, 4=DiagUp
      let lineId = "line-1"; // default center
      if (paylineName === "TOP") lineId = "line-0";
      else if (paylineName === "BOTTOM") lineId = "line-2";
      else if (paylineName === "DIAG1") lineId = "line-3";
      else if (paylineName === "DIAG2") lineId = "line-4";

      const el = document.getElementById(lineId);
      if (el) el.classList.add('active');
    }

    function hidePaylines() {
      document.querySelectorAll('.payline-wire').forEach(l => l.classList.remove('active'));
    }

    function collectWinnings() {
      document.getElementById('btn-collect').disabled = true;
      document.getElementById('btn-gamble').disabled = true;
      clearWinningHighlight();
      hidePaylines();
      showToast(`Collected ${currentRoundWin.toFixed(2)} ETB`);
    }

    function triggerBigWinOverlay(amt) {
      const ov = document.getElementById('celebration-overlay');
      const num = document.getElementById('celebration-amount');
      num.textContent = `${amt.toFixed(2)} ETB`;
      ov.style.display = 'flex';
      setTimeout(() => {
        ov.style.display = 'none';
      }, 2400);
    }

    /* =====================================================================
       7. AUTOPLAY CHECKS & CONDITIONS (Screenshot 1)
       ===================================================================== */
    function checkAutoplayConditions() {
      if (autoplayRemaining <= 0) return;

      const stopWinVal = parseFloat(document.getElementById('auto-stop-win').value) || 0;
      const stopLossVal = parseFloat(document.getElementById('auto-stop-loss').value) || 0;

      if (stopWinVal > 0 && currentRoundWin >= stopWinVal) {
        showToast("Autoplay stopped: Win limit reached");
        autoplayRemaining = 0;
        return;
      }

      if (stopLossVal > 0 && (startingAutoBalance - serverBalance) >= stopLossVal) {
        showToast("Autoplay stopped: Loss limit reached");
        autoplayRemaining = 0;
        return;
      }

      autoplayRemaining--;
      if (autoplayRemaining > 0 && serverBalance >= getCurrentBet()) {
        setTimeout(onSpinClick, 750);
      } else {
        autoplayRemaining = 0;
      }
    }

    function openAutoModal() {
      if (isSpinning) return;
      document.getElementById('modal-auto').style.display = 'flex';
    }

    function selectAutoCount(count, el) {
      selectedAutoCount = count;
      document.querySelectorAll('.auto-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function startAutoplay() {
      closeModals();
      autoplayRemaining = selectedAutoCount;
      startingAutoBalance = serverBalance;
      onSpinClick();
    }

    /* =====================================================================
       8. MODALS & X2 GAMBLE FEATURE (Screenshot 4)
       ===================================================================== */
    function openRulesModal() {
      renderPaytableModal();
      document.getElementById('modal-rules').style.display = 'flex';
    }

    function openGambleModal() {
      if (currentRoundWin <= 0) return;
      document.getElementById('modal-gamble').style.display = 'flex';
    }

    function closeModals() {
      document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none');
    }

    function gamblePick(color) {
      const card = document.getElementById('gamble-card-display');
      card.style.transform = 'scale(0.8) rotateY(90deg)';

      setTimeout(() => {
        const isRed = Math.random() > 0.5;
        const won = (color === 'RED' && isRed) || (color === 'BLACK' && !isRed);

        card.innerHTML = `<span style="font-size:36px; font-weight:900; color:${isRed ? '#e52945' : '#fff'};">${isRed ? '♥' : '♠'}</span>`;
        card.style.transform = 'scale(1) rotateY(0deg)';

        setTimeout(() => {
          if (won) {
            currentRoundWin *= 2;
            document.getElementById('ui-win').textContent = currentRoundWin.toFixed(2);
            showToast(`Gamble WON! Double to ${currentRoundWin.toFixed(2)} ETB`);
            sound.playWin();
          } else {
            currentRoundWin = 0;
            document.getElementById('ui-win').textContent = "0.00";
            document.getElementById('btn-collect').disabled = true;
            document.getElementById('btn-gamble').disabled = true;
            showToast("Gamble Lost!");
          }
          closeModals();
          card.innerHTML = `
            <svg viewBox="0 0 40 40" fill="#10e587">
              <circle cx="15" cy="15" r="7"/>
              <circle cx="25" cy="15" r="7"/>
              <circle cx="15" cy="25" r="7"/>
              <circle cx="25" cy="25" r="7"/>
              <path d="M20 20 L20 36" stroke="#10e587" stroke-width="3" stroke-linecap="round"/>
            </svg>
          `;
        }, 700);
      }, 300);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    // Initialize asset preloading, reels, and bets
    preloadAllImages().then(() => {
      initReelTapes();
      updateBetUI();
    });
  </script>
</body>
</html>
