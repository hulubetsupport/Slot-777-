<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>777 Multi Slot - Master Edition</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-emerald-dark: #041a12;
      --bg-emerald-mid: #0a2e20;
      --gold-border: #ffd700;
      --gold-text: #ffeb3b;
      --gold-dark: #c59b27;
      --ruby-red: #c2185b;
      --btn-green: #00c853;
      --btn-green-hover: #00e676;
      --text-gray: #8ba39a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
    
    .slot-wrapper {
      width: 100%; height: 100vh;
      background: radial-gradient(circle at center, #0a3324 0%, #03140e 100%);
      display: flex; flex-direction: column; position: relative; margin: 0 auto; max-width: 480px;
    }

    /* 1. Header */
    .game-sub-nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px 4px; z-index: 10; flex-shrink: 0;
    }
    .slot-title { font-size: 17px; font-weight: 900; color: var(--gold-text); font-style: italic; }
    .slot-title span { color: #fff; }
    .circle-icon-btn {
      width: 32px; height: 32px; border-radius: 50%; background: #0b2e21; border: 1px solid #1b543d;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff;
    }

    .lines-title-row {
      display: flex; justify-content: space-between; align-items: center; padding: 2px 14px 4px;
      font-size: 11px; font-weight: 900; color: var(--gold-text); letter-spacing: 0.5px; flex-shrink: 0;
    }

    /* 2. Main Slot Machine Arena */
    .slot-machine-arena {
      padding: 0 10px; display: flex; gap: 8px; justify-content: center; position: relative; flex-shrink: 0;
    }

    /* Multiplier Column (Left) */
    .multiplier-col {
      display: flex; flex-direction: column; justify-content: space-around; width: 64px; height: 215px;
      background: rgba(3, 20, 14, 0.75); border: 2px solid var(--gold-dark); border-radius: 8px; padding: 4px 0;
    }
    .mult-box {
      flex: 1; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 900;
      color: #72a38b; margin: 2px 4px; border-radius: 4px; transition: 0.3s;
    }
    .mult-box.active-5x {
      background: #114d35; border: 2px solid #00e676; color: #ff80ab; text-shadow: 0 0 10px #ff4081; box-shadow: 0 0 12px #00e676;
    }
    .mult-box.active-3x {
      background: #114d35; border: 2px solid var(--gold-text); color: var(--gold-text); text-shadow: 0 0 10px var(--gold-text);
    }
    .mult-box.active-1x {
      background: #114d35; border: 2px solid #40c4ff; color: #40c4ff; text-shadow: 0 0 10px #40c4ff;
    }

    /* 3x3 Reels Frame */
    .reels-grid-frame {
      flex: 1; height: 215px; background: rgba(3, 20, 14, 0.85); border: 2px solid var(--gold-dark);
      border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px;
      position: relative; overflow: hidden;
    }
    .reel-strip-col {
      display: flex; flex-direction: column; justify-content: space-around; border-right: 1px solid #144432; position: relative;
    }
    .reel-strip-col:last-child { border-right: none; }
    
    .symbol-cell {
      height: 66px; display: flex; align-items: center; justify-content: center; font-size: 34px;
      position: relative; user-select: none; transition: transform 0.15s;
    }
    .symbol-cell.winning { animation: winPulse 0.5s infinite alternate; }

    /* Winning Payline Glow */
    .payline-glow {
      position: absolute; left: 0; right: 0; height: 4px; background: #ffeb3b;
      box-shadow: 0 0 14px #ffeb3b, 0 0 6px #fff; z-index: 8; display: none;
    }

    /* 3. Middle Status Ribbon */
    .status-ribbon-bar {
      margin: 6px 10px; background: #031710; border: 1.5px solid var(--gold-dark);
      border-radius: 20px; display: flex; justify-content: space-around; align-items: center; padding: 6px 10px; flex-shrink: 0;
    }
    .status-item { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 900; color: #fff; }
    .status-item span { color: var(--gold-text); }

    /* 4. Hexagon Action Buttons */
    .hex-actions-row {
      display: flex; justify-content: center; gap: 14px; margin: 4px 0; flex-shrink: 0;
    }
    .hex-btn {
      width: 58px; height: 52px; background: #0a3324; border: 2px solid var(--gold-dark);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900;
      color: var(--gold-text); cursor: pointer; transition: 0.15s;
    }
    .hex-btn:active { transform: scale(0.92); background: #13523a; }
    .hex-btn.active { border-color: #00e676; color: #00e676; box-shadow: 0 0 10px #00e676; }

    /* 5. Bottom Emerald & Ruby Spin Console */
    .spin-console-wrapper {
      margin-top: auto; padding: 6px 10px 16px; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;
    }
    
    .console-wing-left, .console-wing-right {
      display: flex; align-items: center; gap: 6px; background: #092c1f; border: 2px solid #196346;
      border-radius: 12px; padding: 6px 10px; z-index: 1;
    }
    .step-square-btn {
      width: 28px; height: 28px; background: var(--btn-green); border: none; border-radius: 4px;
      color: #000; font-size: 18px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .wing-amt-text { font-size: 11px; font-weight: 900; color: var(--gold-text); text-align: center; }

    /* Center Big Spin Button */
    .center-spin-button {
      width: 96px; height: 86px; background: #0c3d2a; border: 4px solid #c2185b;
      border-radius: 16px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 15px rgba(194, 24, 91, 0.6);
      margin: 0 -10px; z-index: 5; display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; transition: 0.15s transform;
    }
    .center-spin-button:active { transform: scale(0.94); }
    .spin-btn-val { font-size: 20px; font-weight: 900; color: var(--gold-text); line-height: 1; }
    .spin-btn-currency { font-size: 10px; font-weight: 900; color: #fff; margin-top: 2px; }

    /* Clean Floating Win Banner */
    .clean-win-banner {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #00c853, #00e676); color: #000; font-size: 14px; font-weight: 900;
      padding: 8px 20px; border-radius: 30px; box-shadow: 0 6px 25px rgba(0, 230, 118, 0.6);
      z-index: 9999; display: none; animation: popWin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes winPulse { 0% { transform: scale(1); filter: drop-shadow(0 0 5px #ffd700); } 100% { transform: scale(1.15); filter: drop-shadow(0 0 15px #ffd700); } }
    @keyframes popWin { 0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="slot-wrapper">
  <!-- Clean Win Banner -->
  <div class="clean-win-banner" id="cleanWinBanner">
    🎉 <span id="winBannerText">+0.00 ETB Won!</span>
  </div>

  <!-- 1. Header -->
  <div class="game-sub-nav">
    <div class="slot-title">777 <span>SLOT</span></div>
    <div style="display:flex; gap:8px;">
      <button class="circle-icon-btn" id="soundBtn" onclick="toggleGlobalAudio()" title="Sound Toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold-text)" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>
  </div>

  <!-- Multiplier & Lines Header -->
  <div class="lines-title-row">
    <div>MULTIPLIER</div>
    <div>5 LINES FIXED</div>
  </div>

  <!-- 2. Main Slot Machine Arena -->
  <div class="slot-machine-arena">
    <!-- Multiplier Column (Left) -->
    <div class="multiplier-col">
      <div class="mult-box" id="mult3x">3x</div>
      <div class="mult-box active-5x" id="mult5x">5x</div>
      <div class="mult-box" id="mult1x">1x</div>
    </div>

    <!-- 3x3 Reels Grid -->
    <div class="reels-grid-frame">
      <div class="payline-glow" id="paylineBar"></div>

      <!-- Reel 1 -->
      <div class="reel-strip-col" id="reel1">
        <div class="symbol-cell" id="c00">🍋</div>
        <div class="symbol-cell" id="c10">🍊</div>
        <div class="symbol-cell" id="c20">🍉</div>
      </div>

      <!-- Reel 2 -->
      <div class="reel-strip-col" id="reel2">
        <div class="symbol-cell" id="c01">🍇</div>
        <div class="symbol-cell" id="c11">🎰</div>
        <div class="symbol-cell" id="c21">🔔</div>
      </div>

      <!-- Reel 3 -->
      <div class="reel-strip-col" id="reel3">
        <div class="symbol-cell" id="c02">💰</div>
        <div class="symbol-cell" id="c12">🍒</div>
        <div class="symbol-cell" id="c22">🍇</div>
      </div>
    </div>
  </div>

  <!-- 3. Middle Status Ribbon -->
  <div class="status-ribbon-bar">
    <div class="status-item">
      <span>💰</span>
      <span id="userBalText">0.00</span> ETB
    </div>
    <div class="status-item">
      <span>🏆</span>
      <span id="lastWinText">0.00</span> ETB
    </div>
  </div>

  <!-- 4. Hexagon Action Buttons -->
  <div class="hex-actions-row">
    <div class="hex-btn" id="autoSpinBtn" onclick="toggleAutoSpin()">AUTO</div>
    <div class="hex-btn" id="doubleBetBtn" onclick="multiplyBetBy2()">2x</div>
    <div class="hex-btn" id="turboBtn" onclick="toggleTurbo()">⚡</div>
  </div>

  <!-- 5. Bottom Spin Console -->
  <div class="spin-console-wrapper">
    <div class="console-wing-left">
      <button class="step-square-btn" onclick="stepBetAmount(-1)">−</button>
      <div class="wing-amt-text"><span id="prevBetVal">8</span><br>ETB</div>
    </div>

    <div class="center-spin-button" id="mainSpinBtn" onclick="spinReels()">
      <div class="spin-btn-val" id="currentBetVal">10</div>
      <div class="spin-btn-currency">SPIN</div>
    </div>

    <div class="console-wing-right">
      <div class="wing-amt-text"><span id="nextBetVal">15</span><br>ETB</div>
      <button class="step-square-btn" onclick="stepBetAmount(1)">+</button>
    </div>
  </div>
</div>

<script>
  // ============================================================================
  // 🚀 777 MULTI SLOT - INTEGRATED WITH HULU BET RENDER BACKEND (/api/bet/play)
  // ============================================================================
  const RENDER_BASE_URL = "https://hulubet-server.onrender.com";

  // URL Injection: User ID & Balance from Main Lobby
  const urlParams = new URLSearchParams(window.location.search);
  let USER_ID = urlParams.get('userId') || "589218392";
  let balance = parseFloat(urlParams.get('balance')) || 20.00;

  function triggerCleanWin(msg) {
    const banner = document.getElementById("cleanWinBanner");
    document.getElementById("winBannerText").innerText = msg;
    banner.style.display = "block";
    setTimeout(() => { banner.style.display = "none"; }, 3500);
  }

  // Audio Synthesizer
  let isMuted = false;
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playTone(freq, type, dur) {
    if (isMuted) return;
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  const SOUNDS = {
    spin: () => playTone(320, 'sine', 0.05),
    stop: () => playTone(460, 'triangle', 0.06),
    win: () => {
      playTone(523, 'triangle', 0.1);
      setTimeout(() => playTone(659, 'triangle', 0.1), 90);
      setTimeout(() => playTone(783, 'triangle', 0.25), 180);
    },
    click: () => playTone(700, 'sine', 0.03)
  };

  function toggleGlobalAudio() {
    isMuted = !isMuted;
    document.getElementById("soundBtn").innerHTML = isMuted 
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold-text)" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  }

  const SYMBOLS = ["🍋", "🍊", "🍉", "🍇", "🔔", "🍒", "💰", "🎰"];
  let isSpinning = false;
  let autoSpin = false;
  let turboMode = false;

  const betLevels = [2, 4, 6, 8, 10, 15, 20, 50, 100, 200, 500];
  let betIndex = 4; // 10 ETB default
  let currentBet = betLevels[betIndex];

  function updateBalanceDisplay() {
    document.getElementById("userBalText").innerText = balance.toFixed(2);
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "BALANCE_UPDATE", newBalance: balance }, "*");
      }
    } catch(e) {}
  }
  updateBalanceDisplay();

  // Handshake with Lobby
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "GAME_READY" }, "*");
  }
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT_BALANCE' || e.data?.type === 'UPDATE_BALANCE') {
      if (e.data.balance !== undefined) { balance = parseFloat(e.data.balance); updateBalanceDisplay(); }
      if (e.data.userId) USER_ID = String(e.data.userId);
    }
  });

  function updateBetConsoleUI() {
    currentBet = betLevels[betIndex];
    document.getElementById("currentBetVal").innerText = currentBet;
    document.getElementById("prevBetVal").innerText = betIndex > 0 ? betLevels[betIndex - 1] : "--";
    document.getElementById("nextBetVal").innerText = betIndex < betLevels.length - 1 ? betLevels[betIndex + 1] : "--";
  }
  updateBetConsoleUI();

  // -------------------------------------------------------------
  // 🎰 SPIN ENGINE (Calls Render Backend /api/bet/play with Slot777)
  // -------------------------------------------------------------
  async function spinReels() {
    if (isSpinning) return;
    if (currentBet > balance) {
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "OPEN_DEPOSIT" }, "*");
      autoSpin = false;
      document.getElementById("autoSpinBtn").classList.remove("active");
      return;
    }

    isSpinning = true;
    balance -= currentBet;
    updateBalanceDisplay();
    SOUNDS.click();

    document.getElementById("paylineBar").style.display = "none";
    document.querySelectorAll(".symbol-cell").forEach(el => el.classList.remove("winning"));
    document.querySelectorAll(".mult-box").forEach(el => el.className = "mult-box");

    let serverData = null;
    try {
      const res = await fetch(`${RENDER_BASE_URL}/api/bet/play`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: USER_ID,
          gameName: "Slot777",
          betAmount: currentBet,
          clientData: {}
        })
      });
      serverData = await res.json();
    } catch(e) {}

    const spinInterval = setInterval(() => { SOUNDS.spin(); }, 120);

    const anim = setInterval(() => {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          document.getElementById(`c${r}${c}`).innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }
      }
    }, 60);

    setTimeout(() => {
      clearInterval(anim);
      clearInterval(spinInterval);
      finalizeSpin(serverData);
    }, turboMode ? 350 : 800);
  }

  function finalizeSpin(data) {
    isSpinning = false;
    SOUNDS.stop();

    const isWin = data ? data.isWin : false;
    const payout = data ? data.payout : 0;
    const mult = data ? data.multiplier : 0;
    const reels = data?.visualOutcome?.reels || ["🍋", "🍊", "🍒"];
    const colMult = data?.visualOutcome?.colMult || 1;

    // Set middle winning line directly from Server visual outcome
    document.getElementById("c10").innerText = reels[0];
    document.getElementById("c11").innerText = reels[1];
    document.getElementById("c12").innerText = reels[2];

    // Top & bottom random near-miss fill
    document.getElementById("c00").innerText = "🍇";
    document.getElementById("c01").innerText = "💰";
    document.getElementById("c02").innerText = "🍋";
    document.getElementById("c20").innerText = "🍉";
    document.getElementById("c21").innerText = "🔔";
    document.getElementById("c22").innerText = "🍊";

    if (data && data.newBalance !== undefined) {
      balance = data.newBalance;
    } else if (isWin) {
      balance += payout;
    }
    updateBalanceDisplay();

    if (isWin && payout > 0) {
      document.getElementById("c10").classList.add("winning");
      document.getElementById("c11").classList.add("winning");
      document.getElementById("c12").classList.add("winning");
      document.getElementById("paylineBar").style.top = "108px";
      document.getElementById("paylineBar").style.display = "block";
      document.getElementById("lastWinText").innerText = payout.toFixed(2);

      // Highlight multiplier box
      if (colMult === 5) document.getElementById("mult5x").className = "mult-box active-5x";
      else if (colMult === 3) document.getElementById("mult3x").className = "mult-box active-3x";
      else document.getElementById("mult1x").className = "mult-box active-1x";

      SOUNDS.win();
      triggerCleanWin(`🎉 WIN! +${payout.toFixed(2)} ETB (${mult}x)`);
    } else {
      document.getElementById("lastWinText").innerText = "0.00";
    }

    if (autoSpin) setTimeout(() => { if (autoSpin) spinReels(); }, 1200);
  }

  function stepBetAmount(dir) {
    SOUNDS.click();
    betIndex = Math.max(0, Math.min(betLevels.length - 1, betIndex + dir));
    updateBetConsoleUI();
  }

  function multiplyBetBy2() {
    SOUNDS.click();
    const btn = document.getElementById("doubleBetBtn");
    btn.classList.toggle("active");
    if (btn.classList.contains("active")) {
      betIndex = Math.min(betLevels.length - 1, betIndex + 1);
    } else {
      betIndex = Math.max(0, betIndex - 1);
    }
    updateBetConsoleUI();
  }

  function toggleAutoSpin() {
    SOUNDS.click();
    autoSpin = !autoSpin;
    document.getElementById("autoSpinBtn").classList.toggle("active", autoSpin);
    if (autoSpin && !isSpinning) spinReels();
  }

  function toggleTurbo() {
    SOUNDS.click();
    turboMode = !turboMode;
    document.getElementById("turboBtn").classList.toggle("active", turboMode);
  }
</script>
</body>
</html>
